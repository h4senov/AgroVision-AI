{% extends 'base.html' %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/inventory_theme.css' %}">{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white p-4 text-center border-0">
                    <h4 class="mb-0 fw-bold">📉 Məhsul Çıxışı</h4>
                </div>
                <div class="card-body p-5">
                    
                    <div class="text-center mb-4">
                        <h5 class="fw-bold text-dark">{{ item.item_name }}</h5>
                        <span class="badge bg-light text-dark border px-3 py-2 rounded-pill">
                            Cari Stok: {{ item.quantity }} {{ item.unit }}
                        </span>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">İstifadə miqdarı</label>
                            <div class="input-group input-group-lg">
                                <input type="number" step="0.01" name="used_quantity" class="form-control fw-bold text-primary" placeholder="0.00" required max="{{ item.quantity }}" min="0.01" autofocus>
                                <span class="input-group-text bg-light text-muted">{{ item.unit }}</span>
                            </div>
                            <div class="form-text">Maksimum çıxış edə biləcəyiniz: {{ item.quantity }}</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg rounded-3 shadow-sm">
                                Təsdiqlə
                            </button>
                            <a href="{% url 'inventory:inventory_list' %}" class="btn btn-light text-muted">Ləğv et</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
